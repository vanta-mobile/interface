name: Release Mobile

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
  PRIVY_APP_ID: ${{ vars.PRIVY_APP_ID }}
  PRIVY_CLIENT_ID: ${{ vars.PRIVY_CLIENT_ID }}
  REOWN_PROJECT_ID: ${{ vars.REOWN_PROJECT_ID }}
  WALLET_LOGIN_ORIGIN: ${{ vars.WALLET_LOGIN_ORIGIN || 'https://app.vanta.exchange' }}

jobs:
  detect-release:
    name: Detect Version Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version.outputs.should_build }}
      should_release: ${{ steps.version.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}

      - name: Validate version and decide release
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version_line="$(awk -F': ' '/^version: /{print $2}' pubspec.yaml | tr -d '[:space:]')"
          if [[ ! "$version_line" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?\+([1-9][0-9]*)$ ]]; then
            echo "pubspec.yaml version must use semantic version plus a positive build number, for example 1.0.0+1." >&2
            exit 1
          fi

          version_name="${version_line%%+*}"
          tag="v${version_name}"
          should_build="true"
          should_release="false"
          prerelease="false"
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease="true"
          fi
          if [[ "$prerelease" == "false" && "$TARGET_BRANCH" != "main" ]]; then
            echo "Formal releases are only allowed from the main branch; use a prerelease suffix on ${TARGET_BRANCH}." >&2
            exit 1
          fi

          git fetch --tags --force
          latest_tag="$(
            git tag --sort=-version:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              head -n1 || true
          )"
          previous_tag="$(
            git tag --sort=-version:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              grep -Fxv "$tag" |
              head -n1 || true
          )"

          if [[ -n "$latest_tag" ]]; then
            latest_version="${latest_tag#v}"
            if [[ "$(printf '%s\n' "$version_name" "$latest_version" | sort -V | head -n1)" != "$latest_version" ]]; then
              echo "Version ${version_name} is lower than the latest release ${latest_tag}." >&2
              exit 1
            fi
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tagged_commit" == "$TARGET_SHA" ]]; then
              echo "Version ${version_name} is already released at ${TARGET_SHA}; skipping build and release."
              should_build="false"
              should_release="false"
            elif ! git diff --quiet "$tagged_commit" "$TARGET_SHA" -- .github/workflows/release.yml &&
              git diff --quiet "$tagged_commit" "$TARGET_SHA" -- . ':(exclude).github/workflows/**'; then
              echo "Release workflow changed since ${tag}; rebuilding artifacts without publishing a new release."
              should_build="true"
              should_release="false"
            else
              echo "Version ${version_name} already belongs to ${tagged_commit}; no new release is needed. Skipping build and release."
              should_build="false"
              should_release="false"
            fi
          else
            should_release="true"
          fi

          {
            echo "version=${version_line}"
            echo "tag=${tag}"
            echo "previous_tag=${previous_tag}"
            echo "should_build=${should_build}"
            echo "should_release=${should_release}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  ios-configuration:
    name: Detect iOS Configuration
    needs: detect-release
    if: needs.detect-release.outputs.should_build == 'true'
    uses: ./.github/workflows/ios-configuration.yml
    with:
      apple-team-id: ${{ vars.APPLE_TEAM_ID }}
    secrets:
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

  android-release:
    name: Android Release APK and App Bundle
    needs:
      - detect-release
    if: needs.detect-release.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Setup Android SDK and bundle verification tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required GitHub Secret: $key" >&2
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/vanta-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            tr -d '[:space:]' |
            base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore_path"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Create Flutter environment file
        run: python3 scripts/ci_config.py
      - name: Build Android split APKs
        shell: bash
        run: >-
          flutter build apk --release --split-per-abi --obfuscate
          --target-platform android-arm64,android-x64
          --dart-define-from-file=config/ci.local.json
          --split-debug-info=build/symbols/android
      # Collect the APKs before building the bundle: rebuilding a release
      # variant rewrites shared intermediates.
      - name: Collect split APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-assets
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/release-assets/vanta-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/release-assets/vanta-android-x86_64.apk
      - name: Build Android App Bundle for Google Play
        shell: bash
        run: >-
          flutter build appbundle --release --obfuscate
          --target-platform android-arm64,android-x64
          --dart-define-from-file=config/ci.local.json
          --split-debug-info=build/symbols/android-bundle
      - name: Verify App Bundle signing
        shell: bash
        run: |
          set -euo pipefail
          bundle=build/app/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          jarsigner -verify "$bundle" >/dev/null
          # Play rejects debug-signed bundles only at upload time; fail here.
          keytool -printcert -jarfile "$bundle" | tee "$RUNNER_TEMP/aab-signing.txt"
          if grep -qi "CN=Android Debug" "$RUNNER_TEMP/aab-signing.txt"; then
            echo "App bundle is signed with the debug certificate." >&2
            exit 1
          fi
      - name: Verify App Bundle structure and 16 KB compatibility
        shell: bash
        run: |
          set -euo pipefail
          # Pin both the tool version and its downloaded bytes.
          bundletool="$RUNNER_TEMP/bundletool-all-1.18.2.jar"
          curl --fail --location --retry 3 \
            --output "$bundletool" \
            https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          printf '%s  %s\n' \
            378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584 \
            "$bundletool" | sha256sum --check --status
          python3 scripts/verify_android_bundle.py \
            --bundle build/app/outputs/bundle/release/app-release.aab \
            --bundletool "$bundletool" \
            --zipalign "$ANDROID_HOME/build-tools/36.0.0/zipalign"
      - name: Clean up Android signing credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/vanta-release.jks" config/ci.local.json
      - name: Collect App Bundle and R8 mapping
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/bundle/release/app-release.aab build/release-assets/vanta-android.aab
          # Play needs this to deobfuscate Java/Kotlin stack traces in Vitals.
          cp build/app/outputs/mapping/release/mapping.txt build/release-assets/vanta-android-mapping.txt
      - name: Record Android artifact sizes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Android artifact sizes"
            du -h build/release-assets/*.apk build/release-assets/*.aab
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanta-android
          path: |
            build/release-assets/*.apk
            build/release-assets/*.aab
            build/release-assets/*mapping.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-android
          path: |
            build/symbols/android/
            build/symbols/android-bundle/
          if-no-files-found: error
          retention-days: 30

      - name: Configure optional Google Play upload
        id: google-play
        if: needs.detect-release.outputs.should_release == 'true' && env.TARGET_BRANCH == 'main'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/google_play_release.py configure
      - name: Upload to Google Play internal testing
        if: steps.google-play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJson: ${{ steps.google-play.outputs.credentials_path }}
          packageName: exchange.vanta.vanta
          releaseFiles: build/release-assets/vanta-android.aab
          mappingFile: build/release-assets/vanta-android-mapping.txt
          releaseName: ${{ needs.detect-release.outputs.version }}
          track: internal
          status: completed
          changesNotSentForReview: 'false'
      - name: Record Google Play upload accepted
        if: steps.google-play.outputs.enabled == 'true'
        run: echo "Google Play internal testing upload accepted; Google processing or review may still be pending." >> "$GITHUB_STEP_SUMMARY"
      - name: Record skipped Google Play upload
        if: steps.google-play.outputs.enabled == 'false'
        run: echo "Google Play upload skipped because GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not configured." >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up Google Play credentials
        if: always()
        run: python3 scripts/google_play_release.py cleanup

  ios-release:
    name: iOS Signed Release IPA
    needs:
      - detect-release
      - ios-configuration
    if: needs.detect-release.outputs.should_build == 'true' && needs.ios-configuration.outputs.enabled == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}
      - name: Verify Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

          swift_version="$(swift --version | sed -nE 's/.*Apple Swift version ([0-9]+\.[0-9]+).*/\1/p')"
          if [[ -z "$swift_version" ]]; then
            echo "Unable to determine the Apple Swift compiler version." >&2
            exit 1
          fi

          swift_major="${swift_version%%.*}"
          swift_minor="${swift_version#*.}"
          if (( swift_major < 6 || (swift_major == 6 && swift_minor < 3) )); then
            echo "The pinned PrivySDK requires Apple Swift 6.3 or newer; found ${swift_version}." >&2
            exit 1
          fi
      - name: Setup OpenSSL for certificate compatibility
        shell: bash
        run: |
          set -euo pipefail
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi
          openssl_bin="$(brew --prefix openssl@3)/bin"
          echo "$openssl_bin" >> "$GITHUB_PATH"
          "$openssl_bin/openssl" version
      - name: Prepare iOS signing
        id: signing
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: python3 scripts/ios_release.py prepare-signing
      - name: Configure optional TestFlight upload
        id: testflight
        if: needs.detect-release.outputs.should_release == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/ios_release.py configure-testflight
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Create Flutter environment file
        run: python3 scripts/ci_config.py
      - name: Build and export signed IPA
        env:
          RELEASE_VERSION: ${{ needs.detect-release.outputs.version }}
          IOS_SIGNING_CONFIG: ${{ steps.signing.outputs.signing_config }}
          IOS_EXPORT_OPTIONS: ${{ steps.signing.outputs.export_options }}
        shell: bash
        run: |
          set -euo pipefail
          printf '\n#include "%s"\n' "$IOS_SIGNING_CONFIG" >> ios/Flutter/Release.xcconfig
          flutter build ipa --release --obfuscate \
            --export-options-plist="$IOS_EXPORT_OPTIONS" \
            --build-name="${RELEASE_VERSION%%[-+]*}" \
            --build-number="${RELEASE_VERSION##*+}" \
            --dart-define-from-file=config/ci.local.json \
            --split-debug-info=build/symbols/ios
          shopt -s nullglob
          ipa_files=(build/ios/ipa/*.ipa)
          if (( ${#ipa_files[@]} != 1 )); then
            echo "Expected exactly one signed IPA from Xcode export." >&2
            exit 1
          fi
          if [[ "${ipa_files[0]}" != "build/ios/ipa/vanta-ios.ipa" ]]; then
            cp "${ipa_files[0]}" build/ios/ipa/vanta-ios.ipa
          fi
      - name: Verify signed IPA and capabilities
        id: verify-ipa
        run: python3 scripts/ios_release.py verify-ipa --ipa build/ios/ipa/vanta-ios.ipa
      - name: Preserve failed IPA for diagnosis
        if: failure() && steps.verify-ipa.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: vanta-ios-failed-verification
          path: build/ios/ipa/vanta-ios.ipa
          if-no-files-found: ignore
          retention-days: 7
      - name: Record iOS artifact size
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## iOS artifact size"
            du -h build/ios/ipa/vanta-ios.ipa
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanta-ios
          path: |
            build/ios/ipa/vanta-ios.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload iOS debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-ios
          path: |
            build/symbols/ios/
            build/ios/archive/Runner.xcarchive/dSYMs/
          if-no-files-found: error
          retention-days: 30
      - name: Upload to TestFlight
        if: needs.detect-release.outputs.should_release == 'true' && steps.testflight.outputs.enabled == 'true'
        working-directory: ${{ runner.temp }}/vanta-ios-release
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --upload-app --type ios \
            --file "$GITHUB_WORKSPACE/build/ios/ipa/vanta-ios.ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "TestFlight upload accepted; Apple processing is pending." >> "$GITHUB_STEP_SUMMARY"
      - name: Record skipped TestFlight upload
        if: needs.detect-release.outputs.should_release == 'true' && steps.testflight.outputs.enabled == 'false'
        run: echo "TestFlight upload skipped because no App Store Connect API Key is configured." >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up iOS signing credentials
        if: always()
        run: |
          python3 scripts/ios_release.py cleanup
          rm -f config/ci.local.json

  publish-release:
    name: Publish GitHub Release
    needs:
      - detect-release
      - ios-configuration
      - android-release
      - ios-release
    if: >-
      !cancelled() &&
      needs.detect-release.result == 'success' &&
      needs.ios-configuration.result == 'success' &&
      needs.detect-release.outputs.should_release == 'true' &&
      needs.android-release.result == 'success' &&
      (needs.ios-release.result == 'success' || needs.ios-release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vanta-*
          path: release-assets
          merge-multiple: true
      - name: Build release notes from commits
        env:
          PREVIOUS_TAG: ${{ needs.detect-release.outputs.previous_tag }}
          TAG: ${{ needs.detect-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          range="HEAD"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            range="${PREVIOUS_TAG}..HEAD"
          fi
          {
            echo "## Changes"
            echo
            changes=$(git log "$range" --no-merges --pretty='%s%x09%h' | awk -F '\t' '
              $1 !~ /^(chore|ci|test|style|build)(\([^)]*\))?!?: / {
                printf "- %s (`%s`)\n", $1, $2
              }
            ')
            if [[ -n "$changes" ]]; then
              printf '%s\n' "$changes"
            else
              echo "- No user-facing changes."
            fi
          } > release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect-release.outputs.tag }}
          PRERELEASE: ${{ needs.detect-release.outputs.prerelease }}
          IOS_RELEASE_RESULT: ${{ needs.ios-release.result }}
        shell: bash
        run: |
          set -euo pipefail
          release_args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          release_assets=(
            release-assets/vanta-android-arm64-v8a.apk
            release-assets/vanta-android-x86_64.apk
            release-assets/vanta-android.aab
            release-assets/vanta-android-mapping.txt
          )
          if [[ "$IOS_RELEASE_RESULT" == "success" ]]; then
            release_assets+=(release-assets/vanta-ios.ipa)
          fi
          gh release create "$TAG" \
            "${release_assets[@]}" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --target "${{ env.TARGET_SHA }}" \
            "${release_args[@]}"
