name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Flutter and CI Tools Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Test release and bundle tools
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Test performance reports
        run: node --test scripts/performance-report.test.mjs
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - name: Static analysis
        run: dart analyze --fatal-infos
      - name: Unit and widget tests
        run: flutter test

  android:
    name: Android Release Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify Android build tools
        run: |
          sdkmanager --version
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
      - name: Build APK (development signing, no wallet configuration)
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: vanta-ci-android-development-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  ios-configuration:
    name: Detect iOS Configuration
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/ios-configuration.yml
    with:
      apple-team-id: ${{ vars.APPLE_TEAM_ID }}
    secrets:
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

  ios:
    name: iOS Signing Tools and Unsigned Archive
    needs: ios-configuration
    if: needs.ios-configuration.outputs.enabled == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Setup OpenSSL for certificate compatibility
        shell: bash
        run: |
          set -euo pipefail
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Test PKCS12 compatibility with macOS Keychain
        run: python3 -m unittest discover -s scripts -p 'ios_release_test.py'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build unsigned iOS release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          flutter build ipa --release --no-codesign --obfuscate \
            --split-debug-info=build/symbols/ios \
            --dart-define-from-file=config/privy.example.json \
            > build/ios-release-build.log 2>&1 || {
              tail -n 120 build/ios-release-build.log
              exit 1
            }
      - name: Upload iOS build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-archive-diagnostics
          path: build/ios-release-build.log
          if-no-files-found: ignore
          retention-days: 7
